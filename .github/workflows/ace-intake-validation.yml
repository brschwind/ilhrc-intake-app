name: ACE intake validation
on:
  push:
    branches: [ace-intake-polish]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test src/*.test.js server/*.test.js
      - run: node node_modules/eslint/bin/eslint.js src/App.jsx src/AcePaceIntake.jsx src/ListingPhotoCapture.jsx src/acePace.js src/acePace.test.js src/acePaceMigration.test.js
      - run: npm run build
      - run: npm install --prefix "$RUNNER_TEMP/ace-browser" --no-package-lock playwright@1.56.1 --no-audit --no-fund
      - run: node "$RUNNER_TEMP/ace-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node scripts/check-ace-intake-browser.mjs
        env:
          ACE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/ace-browser/node_modules/playwright/index.mjs
